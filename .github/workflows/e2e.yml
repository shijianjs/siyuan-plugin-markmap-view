name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # setup-node's pnpm cache requires pnpm to exist, so install pnpm first
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      # the tests run the workspace copy of dev/, so build it once before starting the kernel
      - name: Build development bundle
        run: pnpm build:dev

      - name: Prepare SiYuan workspace
        run: |
          mkdir -p ci-workspace/data/plugins/siyuan-plugin-markmap-view
          cp -r dev/. ci-workspace/data/plugins/siyuan-plugin-markmap-view/

      - name: Start SiYuan kernel
        run: |
          docker run -d --name siyuan \
            -v "${GITHUB_WORKSPACE}/ci-workspace:/siyuan/workspace" \
            -p 6806:6806 \
            b3log/siyuan:latest
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:6806/api/system/getWorkspaceInfo \
              -H 'Content-Type: application/json' -d '{}' | grep -q '"code":0'; then
              echo "SiYuan kernel is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SiYuan kernel did not become ready"
          docker logs siyuan
          exit 1

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chrome

      - name: Run Playwright tests
        env:
          SIYUAN_BASE_URL: http://127.0.0.1:6806
        run: pnpm test:only

      - name: Collect kernel log on failure
        if: failure()
        run: |
          docker logs siyuan > siyuan-kernel.log 2>&1 || true
          ls -R ci-workspace/data/plugins/siyuan-plugin-markmap-view > siyuan-plugin-tree.log 2>&1 || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            siyuan-kernel.log
            siyuan-plugin-tree.log
          retention-days: 7